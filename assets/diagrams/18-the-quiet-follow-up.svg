<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="title"><title id="title">Choose the right response to a quiet contact</title><style>:root{--i:#183b56;--l:#607080;--g:#e8f5ed;--a:#fff4dd;--n:#eef2f6}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--g:#183b2a;--a:#4a3610;--n:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.t{font-size:18px;font-weight:700}.s{font-size:14px}.l{stroke:var(--l);stroke-width:3;fill:none}</style><rect class="x" x="290" y="22" width="300" height="62" fill="var(--n)"/><text class="t" x="440" y="61" text-anchor="middle">What has actually happened?</text><path class="l" d="M440 84V125M75 125H805M75 125V170M318 125V170M562 125V170M805 125V170"/><rect class="x" x="15" y="170" width="120" height="90" fill="var(--a)"/><rect class="x" x="258" y="170" width="120" height="90" fill="var(--g)"/><rect class="x" x="502" y="170" width="120" height="90" fill="var(--a)"/><rect class="x" x="745" y="170" width="120" height="90" fill="var(--g)"/><text class="t" x="75" y="202" text-anchor="middle">Explicit</text><text class="t" x="75" y="224" text-anchor="middle">decline</text><text class="s" x="75" y="245" text-anchor="middle">Stop</text><text class="t" x="318" y="202" text-anchor="middle">Unanswered</text><text class="t" x="318" y="224" text-anchor="middle">question</text><text class="s" x="318" y="245" text-anchor="middle">Answer first</text><text class="t" x="562" y="202" text-anchor="middle">Hesitation</text><text class="s" x="562" y="232" text-anchor="middle">Reframe or wait</text><text class="t" x="805" y="202" text-anchor="middle">Plain silence</text><text class="s" x="805" y="232" text-anchor="middle">Follow up, if useful</text></svg>
