<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="title"><title id="title">Evidence becomes a useful prep card</title><style>:root{--i:#183b56;--l:#607080;--b:#dfeaf3;--g:#e8f5ed;--a:#fff4dd;--n:#eef2f6}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--b:#23364a;--g:#183b2a;--a:#4a3610;--n:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.t{font-size:19px;font-weight:700}.s{font-size:15px}.l{stroke:var(--l);stroke-width:3;fill:none}</style><rect class="x" x="25" y="35" width="175" height="82" fill="var(--g)"/><rect class="x" x="235" y="35" width="175" height="82" fill="var(--b)"/><rect class="x" x="445" y="35" width="175" height="82" fill="var(--a)"/><rect class="x" x="655" y="35" width="175" height="82" fill="var(--n)"/><text class="t" x="112" y="72" text-anchor="middle">Confirmed</text><text class="t" x="322" y="72" text-anchor="middle">Public background</text><text class="t" x="532" y="72" text-anchor="middle">Assumptions</text><text class="t" x="742" y="72" text-anchor="middle">Unknowns</text><path class="l" d="M112 117V155M322 117V155M532 117V155M742 117V155M112 155H742M427 155V205"/><rect class="x" x="250" y="205" width="355" height="80" fill="var(--b)"/><text class="t" x="427" y="238" text-anchor="middle">Prep card</text><text class="s" x="427" y="264" text-anchor="middle">Working hypothesis and questions for the real gaps</text></svg>
