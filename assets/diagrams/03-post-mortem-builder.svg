<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="title desc">
<title id="title">Five possible classifications after an outcome</title><desc id="desc">Outcome branches to hard blocker, timing, contact change, unresolved concern and no-decision.</desc>
<style>:root{--ink:#183b56;--line:#607080;--panel:#f6f8fa;--green:#e8f5ed;--amber:#fff4dd;--grey:#eef2f6}@media(prefers-color-scheme:dark){:root{--ink:#e6edf3;--line:#9baabd;--panel:#1f2937;--green:#183b2a;--amber:#4a3610;--grey:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:3;rx:16}.line{stroke:var(--line);stroke-width:3;fill:none}.main{font-size:23px;font-weight:700}.sub{font-size:18px;font-weight:700}</style>
<rect class="box" x="335" y="25" width="190" height="68" fill="var(--panel)"/><text class="main" x="430" y="68" text-anchor="middle">Outcome</text><path class="line" d="M430 93V130M92 130H768M92 130V178M261 130V178M430 130V178M599 130V178M768 130V178"/>
<g fill="var(--grey)"><rect class="box" x="20" y="178" width="144" height="80"/><rect class="box" x="189" y="178" width="144" height="80"/><rect class="box" x="358" y="178" width="144" height="80"/><rect class="box" x="527" y="178" width="144" height="80"/><rect class="box" x="696" y="178" width="144" height="80"/></g>
<text class="sub" x="92" y="220" text-anchor="middle">Hard blocker</text><text class="sub" x="261" y="220" text-anchor="middle">Timing</text><text class="sub" x="430" y="220" text-anchor="middle">Contact change</text><text class="sub" x="599" y="210" text-anchor="middle">Unresolved</text><text class="sub" x="599" y="234" text-anchor="middle">concern</text><text class="sub" x="768" y="220" text-anchor="middle">No-decision</text>
</svg>
