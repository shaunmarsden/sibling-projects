<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" role="img" aria-labelledby="title"><title id="title">Three recipient situations for a fixed template</title><style>:root{--i:#183b56;--l:#607080;--g:#e8f5ed;--a:#fff4dd;--n:#eef2f6}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--g:#183b2a;--a:#4a3610;--n:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.t{font-size:20px;font-weight:700}.s{font-size:15px}</style><rect class="x" x="25" y="55" width="250" height="135" fill="var(--g)"/><rect class="x" x="305" y="55" width="250" height="135" fill="var(--n)"/><rect class="x" x="585" y="55" width="250" height="135" fill="var(--a)"/><text class="t" x="150" y="97" text-anchor="middle">One recipient</text><text class="s" x="150" y="127" text-anchor="middle">Personalise the opening</text><text class="s" x="150" y="150" text-anchor="middle">Keep the template intact</text><text class="t" x="430" y="97" text-anchor="middle">Several recipients</text><text class="s" x="430" y="127" text-anchor="middle">Address every person directly</text><text class="t" x="710" y="97" text-anchor="middle">Forward to someone else</text><text class="s" x="710" y="127" text-anchor="middle">Separate the third-person block</text></svg>
