<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-labelledby="title desc">
<title id="title">Recorded status compared with evidence-supported state</title><desc id="desc">Three examples show why recorded status needs checking.</desc>
<style>:root{--ink:#183b56;--line:#607080;--head:#dfeaf3;--panel:#f6f8fa;--amber:#fff4dd;--green:#e8f5ed}@media(prefers-color-scheme:dark){:root{--ink:#e6edf3;--line:#9baabd;--head:#23364a;--panel:#1f2937;--amber:#4a3610;--green:#183b2a}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.cell{stroke:var(--line);stroke-width:3}.h{font-size:21px;font-weight:700}.b{font-size:20px}</style>
<rect class="cell" x="30" y="25" width="360" height="58" rx="16" fill="var(--head)"/><rect class="cell" x="390" y="25" width="400" height="58" rx="16" fill="var(--head)"/><text class="h" x="210" y="62" text-anchor="middle">Recorded status</text><text class="h" x="590" y="62" text-anchor="middle">Evidence-supported state</text>
<g class="b"><rect class="cell" x="30" y="83" width="360" height="58" fill="var(--panel)"/><rect class="cell" x="390" y="83" width="400" height="58" fill="var(--amber)"/><text x="210" y="120" text-anchor="middle">Done</text><text x="590" y="120" text-anchor="middle">Needs verification</text><rect class="cell" x="30" y="141" width="360" height="58" fill="var(--panel)"/><rect class="cell" x="390" y="141" width="400" height="58" fill="var(--amber)"/><text x="210" y="178" text-anchor="middle">In progress</text><text x="590" y="178" text-anchor="middle">Stale</text><rect class="cell" x="30" y="199" width="360" height="58" fill="var(--panel)"/><rect class="cell" x="390" y="199" width="400" height="58" fill="var(--green)"/><text x="210" y="236" text-anchor="middle">Blocked</text><text x="590" y="236" text-anchor="middle">Blocked (confirmed current)</text></g>
</svg>
