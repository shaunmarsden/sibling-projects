<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" role="img" aria-labelledby="title desc">
<title id="title">Four ways to diagnose an objection</title><desc id="desc">Four equal boxes: genuine fault, feeling unheard, expectation mismatch and pattern signal.</desc>
<style>:root{--ink:#183b56;--line:#607080;--green:#e8f5ed;--amber:#fff4dd;--grey:#eef2f6}@media(prefers-color-scheme:dark){:root{--ink:#e6edf3;--line:#9baabd;--green:#183b2a;--amber:#4a3610;--grey:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:3;rx:16}.label{font-size:22px;font-weight:700}</style>
<rect class="box" x="20" y="45" width="180" height="140" fill="var(--green)"/><rect class="box" x="220" y="45" width="180" height="140" fill="var(--amber)"/><rect class="box" x="420" y="45" width="180" height="140" fill="var(--grey)"/><rect class="box" x="620" y="45" width="180" height="140" fill="var(--green)"/>
<text class="label" x="110" y="105" text-anchor="middle">Genuine</text><text class="label" x="110" y="132" text-anchor="middle">fault</text><text class="label" x="310" y="105" text-anchor="middle">Feeling</text><text class="label" x="310" y="132" text-anchor="middle">unheard</text><text class="label" x="510" y="105" text-anchor="middle">Expectation</text><text class="label" x="510" y="132" text-anchor="middle">mismatch</text><text class="label" x="710" y="105" text-anchor="middle">Pattern</text><text class="label" x="710" y="132" text-anchor="middle">signal</text>
</svg>
