<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-labelledby="title"><title id="title">Choose a first contact based on whether a real signal exists</title><style>:root{--i:#183b56;--l:#607080;--g:#e8f5ed;--a:#fff4dd;--n:#eef2f6}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--g:#183b2a;--a:#4a3610;--n:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.t{font-size:21px;font-weight:700}.s{font-size:16px}.l{stroke:var(--l);stroke-width:3;fill:none}</style><rect class="x" x="245" y="28" width="330" height="72" fill="var(--n)"/><text class="t" x="410" y="73" text-anchor="middle">Real, verifiable signal?</text><path class="l" d="M410 100V150M410 150H185M410 150H635M185 150V205M635 150V205"/><text class="t" x="270" y="142" text-anchor="middle">Yes</text><text class="t" x="550" y="142" text-anchor="middle">No</text><rect class="x" x="55" y="205" width="260" height="82" fill="var(--g)"/><rect class="x" x="505" y="205" width="260" height="82" fill="var(--a)"/><text class="t" x="185" y="241" text-anchor="middle">Draft a short message</text><text class="s" x="185" y="266" text-anchor="middle">Signal, useful offer, reply-level ask</text><text class="t" x="635" y="241" text-anchor="middle">Stop</text><text class="s" x="635" y="266" text-anchor="middle">Do not dress up a generic guess</text></svg>
