<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="title desc">
<title id="title">Choose between Post-Mortem Builder and What's Actually Causing This Delay</title><desc id="desc">A yes no decision tree based on whether the opportunity is already closed or failed.</desc>
<style>:root{--ink:#183b56;--line:#607080;--panel:#f6f8fa;--green:#e8f5ed;--amber:#fff4dd}@media(prefers-color-scheme:dark){:root{--ink:#e6edf3;--line:#9baabd;--panel:#1f2937;--green:#183b2a;--amber:#4a3610}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:3;rx:16}.line{stroke:var(--line);stroke-width:3;fill:none}.main{font-size:22px;font-weight:700}.long{font-size:17px;font-weight:700}.small{font-size:18px;font-weight:700}</style>
<rect class="box" x="250" y="30" width="300" height="78" fill="var(--panel)"/><text class="main" x="400" y="62" text-anchor="middle">Already closed or failed?</text><path class="line" d="M400 108V155M400 155H180M400 155H620M180 155V210M620 155V210"/><text class="small" x="245" y="147" text-anchor="middle">Yes</text><text class="small" x="555" y="147" text-anchor="middle">No</text>
<rect class="box" x="50" y="210" width="260" height="75" fill="var(--amber)"/><rect class="box" x="490" y="210" width="260" height="75" fill="var(--green)"/><text class="main" x="180" y="242" text-anchor="middle">Post-Mortem</text><text class="main" x="180" y="267" text-anchor="middle">Builder</text><text class="long" x="620" y="242" text-anchor="middle">What's Actually Causing</text><text class="long" x="620" y="267" text-anchor="middle">This Delay</text>
</svg>
