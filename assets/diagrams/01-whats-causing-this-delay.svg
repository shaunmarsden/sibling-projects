<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="title desc">
<title id="title">Five possible causes of a delay</title><desc id="desc">Let me think about it branches to five diagnostic outcomes.</desc>
<style>:root{--ink:#183b56;--line:#607080;--panel:#f6f8fa;--green:#e8f5ed;--amber:#fff4dd;--grey:#eef2f6}@media(prefers-color-scheme:dark){:root{--ink:#e6edf3;--line:#9baabd;--panel:#1f2937;--green:#183b2a;--amber:#4a3610;--grey:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:3;rx:16}.line{stroke:var(--line);stroke-width:3;fill:none}.small{font-size:16px}.main{font-size:23px;font-weight:700}.mini{font-size:17px;font-weight:700}.sub{font-size:17px}</style>
<rect class="box" x="310" y="28" width="240" height="68" fill="var(--panel)"/><text class="main" x="430" y="70" text-anchor="middle">Let me think about it.</text>
<path class="line" d="M430 96V130M92 130H768M92 130V178M261 130V178M430 130V178M599 130V178M768 130V178"/>
<g><rect class="box" x="20" y="178" width="144" height="190" fill="var(--green)"/><text class="main" x="92" y="220" text-anchor="middle">Indecision</text><text class="sub" x="92" y="253" text-anchor="middle">Make it feel</text><text class="sub" x="92" y="276" text-anchor="middle">safer</text></g>
<g><rect class="box" x="189" y="178" width="144" height="190" fill="var(--amber)"/><text class="main" x="261" y="220" text-anchor="middle">Unstated</text><text class="main" x="261" y="246" text-anchor="middle">concern</text><text class="sub" x="261" y="285" text-anchor="middle">Drill down</text></g>
<g><rect class="box" x="358" y="178" width="144" height="190" fill="var(--grey)"/><text class="main" x="430" y="220" text-anchor="middle">Approval</text><text class="main" x="430" y="246" text-anchor="middle">dependency</text><text class="sub" x="430" y="285" text-anchor="middle">Wait it out</text></g>
<g><rect class="box" x="527" y="178" width="144" height="190" fill="var(--amber)"/><text class="main" x="599" y="220" text-anchor="middle">Soft no</text><text class="sub" x="599" y="259" text-anchor="middle">Ask directly</text></g>
<g><rect class="box" x="696" y="178" width="144" height="190" fill="var(--green)"/><text class="mini" x="768" y="220" text-anchor="middle">Disqualification</text><text class="sub" x="768" y="259" text-anchor="middle">Say so plainly</text></g>
</svg>
