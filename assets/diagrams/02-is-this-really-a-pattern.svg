<svg xmlns="http://www.w3.org/2000/svg" width="820" height="490" viewBox="0 0 820 490" role="img" aria-labelledby="title desc">
<title id="title">How to tell whether a recurring issue is a genuine pattern</title><desc id="desc">A two by two grid comparing same or different wording and same or different cause.</desc>
<style>:root{--ink:#183b56;--line:#607080;--green:#e8f5ed;--amber:#fff4dd;--grey:#eef2f6}@media(prefers-color-scheme:dark){:root{--ink:#e6edf3;--line:#9baabd;--green:#183b2a;--amber:#4a3610;--grey:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:3;rx:16}.axis{stroke:var(--line);stroke-width:3}.h{font-size:22px;font-weight:700}.b{font-size:19px;font-weight:700}.s{font-size:16px}</style>
<text class="h" x="420" y="32" text-anchor="middle">Wording</text><text class="s" x="305" y="57" text-anchor="middle">Same</text><text class="s" x="615" y="57" text-anchor="middle">Different</text><text class="h" x="28" y="265" transform="rotate(-90 28 265)" text-anchor="middle">Cause</text><text class="s" x="75" y="170" text-anchor="end">Same</text><text class="s" x="75" y="375" text-anchor="end">Different</text>
<rect class="box" x="100" y="80" width="300" height="170" fill="var(--green)"/><text class="b" x="250" y="139" text-anchor="middle">Genuine pattern</text><text class="s" x="250" y="170" text-anchor="middle">if 2+ instances</text>
<rect class="box" x="420" y="80" width="300" height="170" fill="var(--amber)"/><text class="b" x="570" y="139" text-anchor="middle">Misleading surface</text><text class="b" x="570" y="164" text-anchor="middle">pattern</text>
<rect class="box" x="100" y="270" width="300" height="170" fill="var(--green)"/><text class="b" x="250" y="345" text-anchor="middle">Genuine pattern</text>
<rect class="box" x="420" y="270" width="300" height="170" fill="var(--grey)"/><text class="b" x="570" y="345" text-anchor="middle">No shared issue</text>
</svg>
