<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" role="img" aria-labelledby="title"><title id="title">Post mortem or delay diagnosis</title><style>:root{--i:#183b56;--l:#607080;--g:#e8f5ed;--a:#fff4dd;--n:#eef2f6}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--g:#183b2a;--a:#4a3610;--n:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.l{stroke:var(--l);stroke-width:3;fill:none}.t{font-size:20px;font-weight:700}.s{font-size:15px}</style><rect class="x" x="240" y="24" width="320" height="66" fill="var(--n)"/><text class="t" x="400" y="65" text-anchor="middle">Already closed or failed?</text><path class="l" d="M400 90V140M400 140H180M400 140H620M180 140V190M620 140V190"/><text class="t" x="270" y="133" text-anchor="middle">Yes</text><text class="t" x="530" y="133" text-anchor="middle">No</text><rect class="x" x="50" y="190" width="260" height="76" fill="var(--a)"/><rect class="x" x="490" y="190" width="260" height="76" fill="var(--g)"/><text class="t" x="180" y="224" text-anchor="middle">Post-Mortem Builder</text><text class="s" x="180" y="248" text-anchor="middle">Work out what genuinely ended</text><text class="t" x="620" y="224" text-anchor="middle">What's Causing This Delay</text><text class="s" x="620" y="248" text-anchor="middle">Diagnose a still-open decision</text></svg>
