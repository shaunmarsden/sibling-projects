<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-labelledby="title"><title id="title">How to keep a weekly roundup honest</title><style>:root{--i:#183b56;--l:#607080;--g:#e8f5ed;--a:#fff4dd;--n:#eef2f6}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--g:#183b2a;--a:#4a3610;--n:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.t{font-size:20px;font-weight:700}.s{font-size:15px}.l{stroke:var(--l);stroke-width:3;fill:none}</style><rect class="x" x="275" y="24" width="290" height="62" fill="var(--n)"/><text class="t" x="420" y="63" text-anchor="middle">What does this week's data show?</text><path class="l" d="M420 86V125M210 125H630M210 125V166M630 125V166"/><rect class="x" x="55" y="166" width="310" height="98" fill="var(--a)"/><rect class="x" x="475" y="166" width="310" height="98" fill="var(--g)"/><text class="t" x="210" y="204" text-anchor="middle">No earlier baseline</text><text class="s" x="210" y="230" text-anchor="middle">State the snapshot. Do not claim a trend.</text><text class="t" x="630" y="204" text-anchor="middle">Earlier baseline exists</text><text class="s" x="630" y="230" text-anchor="middle">State only the comparison it supports.</text><text class="s" x="420" y="302" text-anchor="middle">In either case: missing is not zero.</text></svg>
