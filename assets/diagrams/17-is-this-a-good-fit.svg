<svg xmlns="http://www.w3.org/2000/svg" width="820" height="190" viewBox="0 0 820 190" role="img" aria-labelledby="title"><title id="title">Three evidence-led fit categories</title><style>:root{--i:#183b56;--l:#607080;--g:#e8f5ed;--a:#fff4dd;--n:#eef2f6}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--g:#183b2a;--a:#4a3610;--n:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.t{font-size:22px;font-weight:700}.s{font-size:15px}</style><rect class="x" x="25" y="48" width="240" height="90" fill="var(--g)"/><rect class="x" x="290" y="48" width="240" height="90" fill="var(--a)"/><rect class="x" x="555" y="48" width="240" height="90" fill="var(--n)"/><text class="t" x="145" y="84" text-anchor="middle">Good fit</text><text class="s" x="145" y="109" text-anchor="middle">Confirmed match</text><text class="t" x="410" y="84" text-anchor="middle">Poor fit</text><text class="s" x="410" y="109" text-anchor="middle">Named mismatch</text><text class="t" x="675" y="84" text-anchor="middle">Uncertain</text><text class="s" x="675" y="109" text-anchor="middle">Not enough evidence yet</text></svg>
