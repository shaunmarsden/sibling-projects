<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-labelledby="title"><title id="title">Build an advocate briefing from what is known</title><style>:root{--i:#183b56;--l:#607080;--b:#dfeaf3;--a:#fff4dd;--g:#e8f5ed}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--b:#23364a;--a:#4a3610;--g:#183b2a}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.t{font-size:20px;font-weight:700}.s{font-size:15px}.l{stroke:var(--l);stroke-width:3;fill:none}</style><rect class="x" x="40" y="30" width="230" height="90" fill="var(--b)"/><rect class="x" x="305" y="30" width="230" height="90" fill="var(--a)"/><rect class="x" x="570" y="30" width="230" height="90" fill="var(--b)"/><text class="t" x="155" y="70" text-anchor="middle">Confirmed problem</text><text class="t" x="420" y="70" text-anchor="middle">Known stakeholder concern</text><text class="t" x="685" y="70" text-anchor="middle">Missing information</text><path class="l" d="M155 120V165M420 120V165M685 120V165M155 165H685M420 165V210"/><rect class="x" x="245" y="210" width="350" height="75" fill="var(--g)"/><text class="t" x="420" y="244" text-anchor="middle">Advocate-ready briefing</text><text class="s" x="420" y="268" text-anchor="middle">What to say, what to ask, what not to claim</text></svg>
