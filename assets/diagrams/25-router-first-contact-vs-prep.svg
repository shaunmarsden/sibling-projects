<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" role="img" aria-labelledby="title"><title id="title">First contact or preparation card</title><style>:root{--i:#183b56;--l:#607080;--g:#e8f5ed;--a:#fff4dd;--n:#eef2f6}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--g:#183b2a;--a:#4a3610;--n:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.l{stroke:var(--l);stroke-width:3;fill:none}.t{font-size:19px;font-weight:700}.s{font-size:14px}</style><rect class="x" x="225" y="24" width="350" height="66" fill="var(--n)"/><text class="t" x="400" y="65" text-anchor="middle">Is a conversation already arranged?</text><path class="l" d="M400 90V140M400 140H180M400 140H620M180 140V190M620 140V190"/><text class="t" x="270" y="133" text-anchor="middle">No</text><text class="t" x="530" y="133" text-anchor="middle">Yes</text><rect class="x" x="50" y="190" width="260" height="76" fill="var(--a)"/><rect class="x" x="490" y="190" width="260" height="76" fill="var(--g)"/><text class="t" x="180" y="224" text-anchor="middle">First Contact</text><text class="s" x="180" y="248" text-anchor="middle">Draft the first message</text><text class="t" x="620" y="224" text-anchor="middle">Prep Card Builder</text><text class="s" x="620" y="248" text-anchor="middle">Organise an upcoming conversation</text></svg>
